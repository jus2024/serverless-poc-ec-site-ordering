name: CI - Web App

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"

jobs:
  quality:
    name: Lint & TypeCheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npx tsc --noEmit

      # amplify/ は独自の tsconfig（CDK 構成と Lambda コード）を持つため別に走らせる
      - name: 型チェック（Amplify バックエンド）
        run: npx tsc --noEmit -p amplify/tsconfig.json

      # 合成テストはローカルの esbuild でアセットをバンドルするため、
      # AWS への接続と認証情報は不要である
      - name: 単体テスト
        run: npm test
